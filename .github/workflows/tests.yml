name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: install.sh (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Syntax check
        run: bash -n install.sh tests/run-tests.sh
      - name: Run tests
        run: bash tests/run-tests.sh

  windows:
    name: install.ps1 (windows)
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Run tests
        shell: powershell
        run: .\tests\run-tests.ps1
